    <meta name="application-name" content="Skylense" />
    <meta name="theme-color" content="#1f7859" />
    <meta
      name="description"
      content="Skylense turns code architecture into an interactive map: explore every layer, follow every connection, and preview the details."
    />
    <title>Skylense · Interactive Codebase Explorer</title>
    <link rel="stylesheet" href="src/style.css" />
    <link rel="stylesheet" href="src/themes.css" />
    <link rel="stylesheet" href="src/paths.css" />
    <link rel="stylesheet" href="src/ingest-ui.css" />

  <body>
    <div id="app"></div>
    <div id="peek" role="tooltip" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <input
      id="import-file"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <script data-skylense-module="model" src="src/model.js"></script>
    <script data-skylense-module="examples" src="src/examples.js"></script>
    <script data-skylense-module="graph" src="src/graph.js"></script>
    <script data-skylense-module="relations" src="src/relations.js"></script>
    <script data-skylense-module="orthogonal" src="src/orthogonal.js"></script>
    <script data-skylense-module="scene" src="src/scene.js"></script>
    <script data-skylense-module="semantics" src="src/semantics.js"></script>
    <script data-skylense-module="context" src="src/context.js"></script>
    <script data-skylense-module="levels" src="src/levels.js"></script>
    <script data-skylense-module="motion" src="src/motion.js"></script>
    <script data-skylense-module="focus" src="src/focus.js"></script>
    <script data-skylense-module="themes" src="src/themes.js"></script>
    <script data-skylense-module="paths" src="src/paths.js"></script>
    <script data-skylense-module="python-structure" src="src/python-structure.js"></script>
    <script data-skylense-module="julia-structure" src="src/julia-structure.js"></script>
    <script data-skylense-module="source-insights" src="src/source-insights.js"></script>
    <script data-skylense-module="source-resolver" src="src/source-resolver.js"></script>
    <script data-skylense-module="syntax-facts" src="src/syntax-facts.js"></script>
    <script data-skylense-module="semantic-julia" src="src/semantic-julia.js"></script>
    <script data-skylense-module="semantic-typescript" src="src/semantic-typescript.js"></script>
    <script data-skylense-module="syntax-version" src="src/syntax-version.js"></script>
    <script data-skylense-module="syntax" src="src/syntax.js"></script>
    <script data-skylense-module="ingest" src="src/ingest.js"></script>
    <script data-skylense-module="ignore" src="src/ignore.js"></script>
    <script data-skylense-module="source-loader" src="src/source-loader.js"></script>
    <script data-skylense-module="analysis-worker" src="src/analysis-worker.js"></script>
    <script data-skylense-module="app" src="src/app.js"></script>
