<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%231f7859%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M10%2032C15%2021%2023%2015%2032%2015C41%2015%2049%2021%2054%2032C49%2043%2041%2049%2032%2049C23%2049%2015%2043%2010%2032Z%22%20stroke%3D%22white%22%20stroke-width%3D%223%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2211%22%20stroke%3D%22white%22%20stroke-width%3D%223%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M24%2032H40M32%2024V40%22%20stroke%3D%22white%22%20stroke-width%3D%222%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%224%22%20fill%3D%22white%22%2F%3E%0A%3C%2Fsvg%3E%0A"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Skylense" />
    <meta name="theme-color" content="#1f7859" />
    <meta
      name="description"
      content="Skylense turns code architecture into an interactive map: explore every layer, follow every connection, and preview the details."
    />
    <title>Skylense · Interactive Codebase Explorer</title>
    <style>
:root {
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    sans-serif;
  color: #24332f;
  background: #f5f7f6;
  font-synthesis: none;
  --bg: #f5f7f6;
  --panel: #fff;
  --soft: #f2f5f3;
  --line: #e3e9e6;
  --text: #24332f;
  --muted: #77837e;
  --accent: #24785a;
  --active: #eaf4ee;
  --shadow: 0 10px 35px #1e44300c;
  --node: #fff;
  --edge: #b9c8c0;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  overflow: hidden;
}
button,
input,
select {
  font: inherit;
}
button,
a,
input,
select {
  outline-offset: 4px;
}
button {
  color: inherit;
  cursor: pointer;
}
button {
  border: 0;
  background: transparent;
}
button:hover {
  background: var(--soft);
}
button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--accent);
}
a {
  color: var(--accent);
  text-decoration: none;
}
svg {
  display: block;
}
button svg {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
}
h1,
h2,
h3,
p {
  margin: 0;
}
small {
  font-size: 11px;
}
button:disabled {
  opacity: 0.35;
  cursor: default;
}
button:disabled:hover {
  background: transparent;
}
code {
  font:
    11px ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;
  overflow-wrap: anywhere;
}
kbd {
  font: 10px inherit;
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 5px;
  color: var(--muted);
}
.app-header {
  height: 66px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 25px;
  gap: 20px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 17px;
  letter-spacing: -0.6px;
  font-weight: 700;
  white-space: nowrap;
}
.brand-mark {
  display: grid;
  grid-template-columns: repeat(2, 7px);
  gap: 3px;
  padding: 10px;
  background: var(--accent);
  border-radius: 9px;
  transform: rotate(-4deg);
}
.brand-mark i {
  width: 7px;
  height: 7px;
  background: white;
  border-radius: 1px;
}
.brand-mark i:last-child {
  opacity: 0.45;
}
.header-divider {
  height: 24px;
  width: 1px;
  background: var(--line);
}
.project-name {
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 9px;
}
.project-name b {
  font-weight: 550;
}
.badge {
  font-size: 10px;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 3px 6px;
  color: var(--muted);
  white-space: nowrap;
}
.spacer {
  flex: 1;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.btn {
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 8px 12px;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  background: var(--panel);
  white-space: nowrap;
}
.btn.primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.btn.primary:hover {
  filter: brightness(1.1);
}
.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 6px;
}
.workspace {
  display: grid;
  grid-template-columns: 234px minmax(300px, 1fr) 326px;
  height: calc(100dvh - 96px);
}
.sidebar {
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: auto;
}
.sidebar-top {
  padding: 22px 18px 15px;
}
.eyebrow {
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 1.5px;
  color: var(--muted);
  text-transform: uppercase;
}
.project-card {
  margin-top: 12px;
  border: 1px solid var(--line);
  padding: 12px;
  border-radius: 8px;
}
.project-card strong {
  display: block;
  font-size: 12px;
  margin-bottom: 5px;
}
.project-card p {
  font-size: 10px;
  color: var(--muted);
  line-height: 1.5;
}
.project-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #52a879;
  margin-right: 5px;
}
.search-wrap {
  position: relative;
  margin: 0 14px 18px;
  display: flex;
  align-items: center;
}
.search-wrap > svg {
  position: absolute;
  left: 10px;
  width: 14px;
  color: var(--muted);
}
.search-wrap input {
  width: 100%;
  height: 34px;
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0 30px;
  font-size: 11px;
  color: var(--text);
}
.search-wrap kbd {
  position: absolute;
  right: 8px;
}
.nav-heading {
  display: flex;
  align-items: center;
  padding: 0 19px;
  margin-bottom: 8px;
  gap: 6px;
}
.nav-heading span:last-child {
  margin-left: auto;
  font-size: 10px;
  color: var(--muted);
}
.tree {
  padding: 0 10px 15px;
}
.tree-row {
  display: flex;
  align-items: center;
  min-height: 32px;
  border-radius: 5px;
  margin: 2px 0;
  gap: 4px;
}
.tree-row.active {
  background: var(--active);
  color: var(--accent);
}
.tree-row .tree-select {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  text-align: left;
  font-size: 11px;
  min-width: 0;
  padding: 7px 3px;
  border-radius: 4px;
}
.tree-select span.name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tree-select small {
  margin-left: auto;
  color: var(--muted);
  font-size: 9px;
  padding-right: 5px;
}
.tree-row .caret {
  width: 20px;
  flex-shrink: 0;
  padding: 4px;
  display: flex;
}
.caret svg {
  width: 12px;
  height: 12px;
}
.dot {
  height: 7px;
  width: 7px;
  border-radius: 2px;
  background: var(--tone, var(--accent));
  flex-shrink: 0;
}
.tree-children {
  margin-left: 11px;
  border-left: 1px solid var(--line);
  padding-left: 5px;
}
.tree-leaf .tree-select {
  font-size: 10px;
}
.tree-leaf .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}
.sidebar-section {
  border-top: 1px solid var(--line);
  padding-top: 18px;
}
.flow-button {
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
  width: calc(100% - 22px);
  margin: 3px 11px;
  padding: 9px 10px;
  border-radius: 6px;
  font-size: 11px;
}
.flow-button svg {
  width: 14px;
  height: 14px;
  color: var(--muted);
}
.flow-button.active {
  background: var(--active);
  color: var(--accent);
}
.sidebar-bottom {
  margin-top: auto;
  padding: 20px 17px 15px;
  font-size: 10px;
  line-height: 1.6;
  color: var(--muted);
}
.sidebar-bottom a {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
}
.sidebar-bottom svg {
  width: 12px;
  height: 12px;
}
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.canvas-header {
  background: var(--panel);
  padding: 20px 27px 15px;
  border-bottom: 1px solid var(--line);
}
.breadcrumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 15px;
  flex-wrap: wrap;
}
.breadcrumbs button {
  padding: 2px 0;
}
.breadcrumbs svg {
  width: 10px;
  height: 10px;
}
.page-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.page-title h1 {
  font-size: 22px;
  letter-spacing: -0.7px;
  font-weight: 650;
}
.live-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #2d9562;
}
.subtitle {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.7;
}
.canvas-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  min-height: 56px;
}
.segmented {
  display: flex;
  padding: 3px;
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 7px;
  gap: 2px;
}
.segmented button {
  padding: 6px 9px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  white-space: nowrap;
}
.segmented button svg {
  width: 13px;
  height: 13px;
}
.segmented button.active {
  background: var(--panel);
  box-shadow: 0 1px 4px #20342812;
  color: var(--accent);
}
.toolbar-select {
  font-size: 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
  background: var(--panel);
  padding: 7px;
  max-width: 130px;
}
.toolbar-label {
  font-size: 10px;
  color: var(--muted);
}
.canvas {
  flex: 1;
  position: relative;
  overflow: hidden;
  background-image: radial-gradient(var(--edge) 0.65px, transparent 0.65px);
  background-size: 19px 19px;
  touch-action: none;
  cursor: grab;
  min-height: 180px;
}
.canvas.dragging {
  cursor: grabbing;
}
.canvas-world {
  position: absolute;
  transform-origin: 0 0;
  top: 0;
  left: 0;
}
.edges {
  position: absolute;
  overflow: visible;
  pointer-events: none;
  left: 0;
  top: 0;
}
.edge {
  fill: none;
  stroke: var(--edge);
  stroke-width: 1.4;
}
.edge.emphasis {
  stroke: var(--accent);
  stroke-width: 2.3;
}
.edge.muted {
  opacity: 0.15;
}
.edge-label {
  font-size: 9px;
  fill: var(--muted);
  paint-order: stroke;
  stroke: var(--bg);
  stroke-width: 5px;
  stroke-linejoin: round;
}
.group-boundary {
  position: absolute;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: color-mix(in srgb, var(--panel) 65%, transparent);
  pointer-events: none;
}
.boundary-title {
  position: absolute;
  top: 12px;
  left: 15px;
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.4px;
  pointer-events: auto;
}
.boundary-title:hover {
  color: var(--accent);
}
.boundary-title svg {
  height: 12px;
  width: 12px;
}
.graph-node {
  position: absolute;
  border: 1px solid var(--line);
  background: var(--node);
  border-radius: 9px;
  box-shadow: 0 3px 10px #263e2c05;
  padding: 15px;
  text-align: left;
  cursor: pointer;
  transition:
    box-shadow 0.15s,
    border-color 0.15s,
    opacity 0.15s;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow: hidden;
}
.graph-node:hover {
  border-color: var(--tone);
  box-shadow: 0 5px 17px #1e443012;
  transform: translateY(-1px);
}
.graph-node.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent);
}
.graph-node.dimmed {
  opacity: 0.28;
}
.node-top {
  display: flex;
  align-items: center;
  gap: 8px;
}
.node-icon {
  height: 28px;
  width: 28px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  color: var(--tone);
  background: color-mix(in srgb, var(--tone) 9%, var(--panel));
}
.node-icon svg {
  width: 15px;
  height: 15px;
}
.node-label {
  font-size: 12px;
  font-weight: 650;
  letter-spacing: -0.15px;
  line-height: 1.3;
}
.node-kind {
  font-size: 8px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 3px;
}
.node-description {
  font-size: 10px;
  color: var(--muted);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.node-footer {
  display: flex;
  align-items: center;
  font-size: 8px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 9px;
  margin-top: auto;
  gap: 6px;
}
.node-footer span:last-child {
  margin-left: auto;
}
.node-footer svg {
  height: 10px;
  width: 10px;
}
.node-port {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--tone);
  border: 1px solid var(--panel);
  top: 50%;
}
.port-in {
  left: -3px;
}
.port-out {
  right: -3px;
}
.canvas-note {
  position: absolute;
  top: 16px;
  left: 20px;
  display: flex;
  gap: 6px;
  font-size: 10px;
  color: var(--muted);
  padding: 7px 9px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 5px;
  max-width: 85%;
  pointer-events: none;
}
.canvas-note svg {
  height: 12px;
  width: 12px;
  flex-shrink: 0;
}
.canvas-controls {
  position: absolute;
  bottom: 20px;
  left: 20px;
  display: flex;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 3px;
  box-shadow: var(--shadow);
}
.canvas-controls span {
  min-width: 40px;
  text-align: center;
  font-size: 10px;
  color: var(--muted);
}
.minimap {
  position: absolute;
  right: 20px;
  bottom: 20px;
  width: 145px;
  height: 93px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 8px;
  box-shadow: var(--shadow);
  cursor: pointer;
}
.minimap svg {
  width: 100%;
  height: 100%;
}
.canvas-legend {
  display: flex;
  gap: 16px;
  align-items: center;
  padding: 10px 24px;
  background: var(--panel);
  border-top: 1px solid var(--line);
  font-size: 9px;
  color: var(--muted);
  min-height: 35px;
}
.canvas-legend span {
  display: flex;
  align-items: center;
  gap: 5px;
}
.legend-line {
  width: 16px;
  border-top: 1px solid var(--edge);
}
.legend-line.accent {
  border-color: var(--accent);
}
.inspector {
  background: var(--panel);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.inspector-top {
  padding: 20px 20px 0;
}
.inspector-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.inspector-title {
  display: flex;
  align-items: center;
  gap: 10px;
}
.inspector-title .node-icon {
  width: 36px;
  height: 36px;
}
.inspector-title h2 {
  font-size: 17px;
  letter-spacing: -0.5px;
  line-height: 1.3;
}
.inspector-title p {
  font-size: 10px;
  color: var(--muted);
  margin-top: 5px;
}
.inspect-actions {
  display: flex;
  gap: 6px;
  margin: 17px 0;
}
.inspect-actions .btn {
  font-size: 10px;
  flex: 1;
  padding: 7px 5px;
}
.inspect-actions svg {
  width: 13px;
  height: 13px;
}
.inspector-tabs {
  display: flex;
  border-bottom: 1px solid var(--line);
  padding: 0 15px;
}
.inspector-tabs button {
  padding: 11px 9px;
  font-size: 10px;
  color: var(--muted);
  border-bottom: 2px solid transparent;
}
.inspector-tabs button.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.inspector-content {
  padding: 20px;
  overflow: auto;
  flex: 1;
}
.section-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--muted);
  text-transform: uppercase;
  font-weight: 650;
  margin-bottom: 10px;
}
.section-label span {
  font-weight: 400;
  letter-spacing: 0;
}
.detail-text {
  font-size: 11px;
  line-height: 1.8;
  color: var(--text);
  margin-bottom: 20px;
  white-space: pre-line;
}
.file-path {
  background: var(--soft);
  border: 1px solid var(--line);
  padding: 11px;
  border-radius: 6px;
  line-height: 1.65;
  margin-bottom: 7px;
  color: var(--text);
}
.micro {
  font-size: 9px;
  line-height: 1.6;
  color: var(--muted);
}
.stats-row {
  display: flex;
  border: 1px solid var(--line);
  border-radius: 7px;
  margin: 20px 0;
}
.stat {
  padding: 12px 6px;
  text-align: center;
  flex: 1;
}
.stat + .stat {
  border-left: 1px solid var(--line);
}
.stat b {
  display: block;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 4px;
}
.stat span {
  font-size: 9px;
  color: var(--muted);
}
.function {
  border: 1px solid var(--line);
  border-radius: 6px;
  margin-bottom: 8px;
  background: var(--panel);
  overflow: hidden;
}
.function summary {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 11px;
  cursor: pointer;
  font:
    10px ui-monospace,
    monospace;
  overflow-wrap: anywhere;
  line-height: 1.6;
}
.function summary::before {
  content: "ƒ";
  color: var(--accent);
  font-style: italic;
  font-weight: 700;
}
.function[open] summary {
  background: var(--soft);
  border-bottom: 1px solid var(--line);
}
.function-body {
  padding: 11px;
  font-size: 10px;
  line-height: 1.8;
}
.function-body .io {
  padding: 7px 0;
  border-top: 1px solid var(--line);
  margin-top: 7px;
}
.io b {
  display: block;
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--muted);
  margin-bottom: 3px;
}
.connection {
  padding: 11px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  margin-bottom: 7px;
  font-size: 11px;
}
.connection span {
  min-width: 0;
}
.connection small {
  font-size: 9px;
  color: var(--muted);
  display: block;
  margin-top: 4px;
  overflow-wrap: anywhere;
}
.connection svg {
  height: 13px;
  width: 13px;
  flex-shrink: 0;
  margin-left: auto;
  color: var(--muted);
}
.connection-type {
  font-size: 8px !important;
  padding: 3px 5px;
  background: var(--soft);
  border-radius: 4px;
  margin-left: auto;
  color: var(--muted);
}
.evidence-card {
  margin-bottom: 16px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 7px;
}
.evidence-card pre {
  font:
    10px/1.65 ui-monospace,
    monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 250px;
  overflow: auto;
  color: var(--text);
  padding-top: 9px;
  border-top: 1px solid var(--line);
}
.evidence-card small {
  display: block;
  font-size: 9px;
  color: var(--muted);
  margin: 6px 0;
}
.evidence-card button {
  font-size: 10px;
  color: var(--accent);
  padding: 4px 0;
}
.empty-state {
  padding: 25px 5px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.8;
}
.inspector-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 9px;
  color: var(--muted);
}
.inspector-footer svg {
  width: 12px;
  height: 12px;
}
.statusbar {
  height: 30px;
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 18px;
  background: var(--panel);
  border-top: 1px solid var(--line);
  font-size: 9px;
  color: var(--muted);
}
.statusbar span {
  display: flex;
  align-items: center;
  gap: 5px;
}
.statusbar svg {
  height: 11px;
  width: 11px;
}
.statusbar .spacer {
  margin: 0;
}
.story-strip {
  padding: 12px 22px;
  background: var(--active);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
}
.story-strip strong {
  font-size: 11px;
}
.story-strip p {
  font-size: 9px;
  line-height: 1.5;
  color: var(--muted);
}
.story-progress {
  display: flex;
  gap: 4px;
}
.story-progress button {
  height: 5px;
  width: 20px;
  background: var(--line);
  padding: 0;
  border-radius: 2px;
}
.story-progress button.active {
  background: var(--accent);
}
#peek {
  position: fixed;
  width: 282px;
  padding: 16px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 9px;
  box-shadow: 0 14px 40px #152e2520;
  z-index: 50;
  pointer-events: none;
}
#peek h3 {
  font-size: 13px;
  margin-bottom: 7px;
}
#peek p {
  font-size: 11px;
  line-height: 1.6;
  margin-bottom: 8px;
  color: var(--muted);
}
#peek code {
  font-size: 10px;
}
#peek .peek-counts {
  display: flex;
  gap: 12px;
  font-size: 9px;
  padding-top: 10px;
  margin-top: 10px;
  border-top: 1px solid var(--line);
  color: var(--accent);
}
#toast {
  position: fixed;
  left: 50%;
  bottom: 52px;
  transform: translate(-50%, 15px);
  background: var(--text);
  color: var(--panel);
  font-size: 12px;
  line-height: 1.6;
  padding: 11px 18px;
  border-radius: 8px;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: 0.2s;
  z-index: 100;
  max-width: 85vw;
}
#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
dialog {
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 0;
  width: min(760px, 90vw);
  max-height: 85vh;
  box-shadow: 0 25px 100px #0c221e33;
}
dialog::backdrop {
  background: #162b2340;
  backdrop-filter: blur(3px);
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  border-bottom: 1px solid var(--line);
}
.modal-header h2 {
  font-size: 18px;
}
.modal-content {
  padding: 24px;
  overflow: auto;
}
.modal-content label {
  display: block;
  font-size: 11px;
  margin-bottom: 10px;
}
.modal-content input,
.modal-content select {
  width: 100%;
  padding: 11px;
  background: var(--soft);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 6px;
  margin: 6px 0 16px;
}
.modal-content p {
  font-size: 12px;
  line-height: 1.8;
  color: var(--muted);
  margin-bottom: 18px;
}
.modal-content pre {
  white-space: pre-wrap;
  font:
    11px/1.9 ui-monospace,
    monospace;
  overflow-wrap: anywhere;
  max-height: 58vh;
  overflow: auto;
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 15px;
}
.compare-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.compare-grid h3 {
  font-size: 15px;
  margin-bottom: 10px;
}
.compare-grid p {
  font-size: 11px;
}
.compare-grid ul {
  font-size: 11px;
  padding-left: 15px;
  line-height: 1.9;
}
.export-option {
  display: flex;
  align-items: center;
  gap: 15px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  width: 100%;
  margin-bottom: 10px;
}
.export-option svg {
  width: 22px;
  height: 22px;
  color: var(--accent);
}
.export-option b {
  font-size: 12px;
  display: block;
  margin-bottom: 4px;
}
.export-option small {
  font-size: 10px;
  color: var(--muted);
}
.bookmark {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 5px 12px;
  font-size: 10px;
}
.bookmark .saved-load {
  flex: 1;
  text-align: left;
  padding: 8px;
  border-radius: 5px;
}
.search-results {
  padding: 0 14px;
}
.result {
  display: block;
  width: 100%;
  text-align: left;
  padding: 10px 8px;
  border-radius: 5px;
  border-bottom: 1px solid var(--line);
  font-size: 11px;
}
.result small {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: 9px;
  overflow-wrap: anywhere;
}
.compare-float {
  position: absolute;
  top: 18px;
  right: 18px;
  background: var(--panel);
  border: 1px solid var(--accent);
  padding: 10px;
  border-radius: 7px;
  z-index: 5;
  max-width: 240px;
  font-size: 10px;
}
.compare-float button {
  color: var(--accent);
  padding: 4px;
  font-size: 10px;
}
.compare-float p {
  line-height: 1.6;
  margin-bottom: 6px;
}
.hidden {
  display: none !important;
}
body.dark {
  --bg: #151c19;
  --panel: #1b2520;
  --soft: #232e27;
  --line: #344239;
  --text: #dde8df;
  --muted: #9daea2;
  --accent: #80c8a2;
  --active: #283e31;
  --node: #202c25;
  --edge: #4a6052;
  background: var(--bg);
  color: var(--text);
}
body.dark .btn.primary {
  color: #17251c;
}
body.dark .brand-mark {
  background: #3a8962;
}
.mobile-toggle {
  display: none;
}
@media (min-width: 1650px) {
  .workspace {
    grid-template-columns: 250px minmax(300px, 1fr) 360px;
  }
  .inspector-content {
    padding: 24px;
  }
  .inspector-top {
    padding: 24px 24px 0;
  }
  .graph-node {
    box-shadow: 0 4px 15px #203f2708;
  }
}
@media (max-width: 1200px) {
  .workspace {
    grid-template-columns: 200px minmax(240px, 1fr) 290px;
  }
  .project-name .badge {
    display: none;
  }
  .app-header {
    padding: 0 16px;
    gap: 14px;
  }
  .canvas-header {
    padding: 18px;
  }
  .canvas-toolbar {
    padding: 10px;
    gap: 5px;
  }
  .toolbar-label {
    display: none;
  }
  .segmented button {
    padding: 6px;
  }
  .tree-select span.name {
    font-size: 10px;
  }
  .inspector-top {
    padding: 17px 15px 0;
  }
  .inspector-content {
    padding: 16px;
  }
  .inspector-tabs {
    padding: 0 6px;
  }
  .inspector-tabs button {
    padding: 10px 8px;
  }
}
@media (max-width: 950px) {
  .workspace {
    grid-template-columns: 190px minmax(260px, 1fr);
  }
  .inspector {
    position: absolute;
    right: 0;
    top: 66px;
    bottom: 30px;
    width: 315px;
    z-index: 15;
    box-shadow: -10px 0 30px #14281c10;
    display: none;
  }
  .inspector.open {
    display: flex;
  }
  .mobile-toggle {
    display: inline-flex;
  }
  .project-name {
    display: none;
  }
  .main {
    min-width: 0;
  }
  .header-actions {
    gap: 5px;
  }
  .canvas-toolbar {
    padding: 10px 16px;
  }
}
@media (max-width: 620px) {
  .workspace {
    grid-template-columns: 1fr;
  }
  .sidebar {
    display: none;
    position: absolute;
    left: 0;
    top: 66px;
    bottom: 30px;
    width: 245px;
    z-index: 20;
    box-shadow: 10px 0 30px #14281c20;
  }
  .sidebar.open {
    display: flex;
  }
  .app-header {
    gap: 7px;
    padding: 0 10px;
  }
  .header-divider {
    display: none;
  }
  .brand {
    font-size: 15px;
    gap: 6px;
  }
  .brand-mark {
    padding: 8px;
  }
  .header-actions .hide-mobile {
    display: none;
  }
  .header-actions .btn {
    font-size: 10px;
    padding: 7px 9px;
  }
  .page-title h1 {
    font-size: 19px;
  }
  .canvas-toolbar {
    padding: 9px 10px;
    gap: 4px;
    flex-wrap: wrap;
  }
  .canvas-toolbar .spacer {
    display: none;
  }
  .toolbar-select {
    margin-left: auto;
  }
  .canvas-header {
    padding: 15px;
  }
  .canvas-legend {
    padding: 10px;
    font-size: 8px;
    gap: 9px;
  }
  .minimap {
    width: 105px;
    height: 72px;
    right: 12px;
    bottom: 14px;
  }
  .canvas-controls {
    left: 12px;
    bottom: 14px;
  }
  .statusbar {
    font-size: 8px;
    padding: 0 10px;
    gap: 10px;
  }
  .statusbar .status-extra {
    display: none;
  }
  .inspector {
    width: min(345px, 100vw);
  }
  .story-strip {
    padding: 10px;
  }
  .compare-grid {
    grid-template-columns: 1fr;
  }
  .modal-content {
    padding: 18px;
  }
  .canvas-note {
    font-size: 9px;
    left: 12px;
    top: 12px;
  }
  .compare-float {
    top: 47px;
    right: 12px;
  }
  .search-wrap input {
    font-size: 12px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    transition: none !important;
    animation: none !important;
  }
}

.project-name > svg {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
}
.project-name {
  white-space: nowrap;
}
.project-name b {
  white-space: nowrap;
}
.btn > svg {

}
.compare-float p > svg {
  width: 13px;
  height: 13px;
  display: inline-block;
  vertical-align: middle;
}
.graph-node.dimmed {
  opacity: 0.63;
}
.group-boundary {
  z-index: 0;
}
.edges {
  z-index: 1;
}
.graph-node {
  z-index: 2;
}
.boundary-title {
  z-index: 3;

.node-label {

}
.node-description {

/* First-class relations and explicit nested hierarchy. */
.structure-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 7px 20px;
  min-height: 38px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  font-size: 10px;
  color: var(--muted);
}
.structure-toolbar button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 7px;
  border-radius: 5px;
  font-size: 10px;
}
.structure-toolbar button svg {
  width: 12px;
  height: 12px;
}
.structure-control[aria-pressed="true"] {
  background: var(--active);
  color: var(--accent);
}
.structure-up {
  color: var(--accent);
}
.node-wrap {
  position: absolute;
  z-index: 3;
}
.node-wrap .graph-node {
  left: 0;
  top: 0;
  position: absolute;
}
.node-wrap .graph-node:hover {
  transform: none;
}
.node-wrap .graph-node {
  gap: 6px;
  padding: 13px;
}
.node-wrap .node-footer {
  padding-top: 7px;
}
.node-wrap .node-description {
  -webkit-line-clamp: 2;
  font-size: 10px;
}
.node-wrap .node-label {
  font-size: 12px;
}
.node-wrap .node-footer {
  font-size: 8px;
  padding-right: 22px;
}
.child-preview {
  display: flex;
  flex-direction: column;
  gap: 5px;
  overflow: hidden;
  font-size: 9px;
  color: var(--muted);
}
.child-preview > span {
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.child-preview svg {
  width: 11px;
  height: 11px;
}
.node-expand {
  position: absolute;
  z-index: 4;
  bottom: 7px;
  right: 8px;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--panel);
  color: var(--accent);
}
.node-expand svg {
  width: 13px;
  height: 13px;
}
.nested-boundary {
  background: color-mix(in srgb, var(--panel) 45%, transparent);
  border-style: dashed;
  border-color: color-mix(in srgb, var(--muted) 35%, var(--line));
  border-radius: 8px;
}
.nested-boundary .boundary-title {
  top: 10px;
  font-size: 10px;
  color: var(--text);
  background: var(--panel);
  padding: 4px 5px;
  left: 10px;
  pointer-events: auto;
}
.boundary-collapse {
  position: absolute;
  top: 11px;
  right: 10px;
  pointer-events: auto;
  z-index: 3;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--panel);
}
.boundary-collapse svg {
  height: 12px;
  width: 12px;
}
.edges {
  pointer-events: none;
  z-index: 2;
}
.edge {
  stroke-width: 1.4;
  stroke-linejoin: miter;
  stroke-linecap: butt;
}
.edge.emphasis {
  stroke-width: 1.9;
}
.wire-halo {
  fill: none;
  stroke: var(--bg);
  stroke-width: 5;
  pointer-events: none;
  stroke-linejoin: miter;
}
.edge-hit {
  fill: none;
  stroke: transparent;
  stroke-width: 12;
  pointer-events: stroke;
  cursor: pointer;
  outline: none;
}
.edge-hit:focus {
  stroke: color-mix(in srgb, var(--accent) 20%, transparent);
}
.relation-wire:hover .edge {
  stroke: var(--accent);
  stroke-width: 2.5;
}
.relation-hub {
  position: absolute;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  border-radius: 4px;
  font-size: 9px;
  padding: 5px 7px;
  box-shadow: 0 2px 5px #1e443008;
  cursor: pointer;
}
.relation-hub > span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  text-align: left;
}
.relation-hub b {
  font-size: 9px;
  font-weight: 600;
  padding-left: 4px;
  border-left: 1px solid var(--line);
  color: var(--accent);
}
.relation-hub.active {
  border-color: color-mix(in srgb, var(--accent) 50%, var(--line));
  color: var(--accent);
}
.relation-hub.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
  background: var(--active);
}
.relation-diamond {
  width: 7px;
  height: 7px;
  display: inline-block;
  transform: rotate(45deg);
  border: 1px solid currentColor;
  background: var(--panel);
  flex-shrink: 0;
  border-radius: 1px;
}
.relation-icon {
  color: var(--accent);
  background: var(--active);
}
.connection-row {
  border: 1px solid var(--line);
  border-radius: 6px;
  margin-bottom: 9px;
  overflow: hidden;
}
.connection-row > .connection {
  border: 0;

  border-radius: 0;
  padding: 10px;
}
.edge-detail-button {

  justify-content: space-between;
  gap: 8px;
  background: var(--soft);
  width: 100%;
  font-size: 9px;
  color: var(--accent);
  padding: 6px 10px;
  border-top: 1px solid var(--line);
}
.edge-detail-button svg {
  width: 12px;
  height: 12px;
}
.inspector-breadcrumbs {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  line-height: 1.8;
  margin-bottom: 8px;
  color: var(--muted);
}
.inspector-breadcrumbs svg {
  width: 9px;
  height: 9px;
}
.inspector-breadcrumbs button {
  padding: 2px 3px;
  border-radius: 3px;
  text-align: left;
}
.parent-button {
  font-size: 9px;
  padding: 6px 8px;
  margin-bottom: 21px;
  white-space: normal;
  text-align: left;
}
.parent-button svg {
  width: 12px;
  height: 12px;
}
.return-relation {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 5px;
  width: 100%;
  margin-bottom: 19px;
  font-size: 10px;
  color: var(--accent);
  text-align: left;
}
.return-relation svg {
  width: 12px;
  height: 12px;
}
.relation-description {
  padding: 12px;
  background: var(--soft);
  border-radius: 6px;
  border: 1px solid var(--line);
}
.relation-description strong {
  font-size: 12px;
}
.relation-description p {
  font-size: 10px;
  line-height: 1.8;
  color: var(--muted);
  margin: 7px 0 10px;
}
.relation-parent-scope {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 10px;
  font-size: 11px;
}
.relation-parent-scope svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}
.relation-parent-scope svg:last-child {
  margin-left: auto;
}
.relation-member {
  position: relative;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 5px;
  text-align: left;
  padding: 11px 25px 11px 11px;
  border: 1px solid var(--line);
  border-radius: 6px;
  margin-bottom: 8px;
}
.relation-member small {
  font:
    9px ui-monospace,
    monospace;
  color: var(--accent);
}
.relation-member b {
  font-size: 10px;
  font-weight: 550;
  line-height: 1.7;
}
.relation-member span {
  font-size: 10px;
  color: var(--muted);
}
.relation-member svg {
  position: absolute;
  right: 8px;
  top: 40%;
  width: 12px;
  height: 12px;
  color: var(--muted);
}
.endpoint-card {
  border: 1px solid var(--line);
  border-radius: 6px;
  margin-bottom: 9px;
  overflow: hidden;
}
.endpoint-card > .connection {
  margin: 0;

  border-radius: 0;

.endpoint-ancestors {
  display: flex;
  gap: 2px;
  flex-wrap: wrap;
  align-items: center;

  border-top: 1px solid var(--line);
  font-size: 8px;
  color: var(--muted);
}
.endpoint-ancestors button {

      "content": "# 实验闭环是协议，不是调度服务\n\n来源：[karpathy/autoresearch](https://github.com/karpathy/autoresearch/tree/228791fb499afffb54b46200aca536f79142f117)，固定提交 `228791fb499afffb54b46200aca536f79142f117`。以下说明由 Skylense 编写；未运行训练，也不展示虚构成绩。\n\n`program.md` 描述研究代理的工作方式：提出对 `train.py` 的改动，记录候选提交，运行训练，读取指标，写入 `results.tsv`，再决定保留还是回退。Skylense 将这份文件当作展示数据，不执行其中的命令。\n\n## 三种层次\n\n- 协议节点：允许的改动范围、比较准则和循环步骤。\n- 源码节点：训练、模型、优化器与评估的真实符号和顶层阶段。\n- 运行产物：`run.log` 与 `results.tsv` 是协议描述的生成物；固定提交没有本次实验结果，本示例也没有代填任何指标。\n\n反馈线表示代理会读取评价结果继续研究，不意味着 Python 文件内存在自动循环代理。查看 [原始协议](https://github.com/karpathy/autoresearch/blob/228791fb499afffb54b46200aca536f79142f117/program.md#L90-L110) 可以核对每一步。"
    },
    {
      "id": "AR_data_guide",
      "title": "从数据分片到训练批次",
      "path": "skylense-guides/autoresearch-data.md",
      "status": "authored-reading-guide",
      "content": "# 数据准备与共享运行工具\n\n来源：[karpathy/autoresearch](https://github.com/karpathy/autoresearch/tree/228791fb499afffb54b46200aca536f79142f117)，固定提交 `228791fb499afffb54b46200aca536f79142f117`。以下说明由 Skylense 编写；未运行训练，也不展示虚构成绩。\n\n`prepare.py` 既提供一次性准备入口，也向 `train.py` 导出分词、数据装填和评估工具。准备入口先选择并下载训练分片及固定验证分片，再训练 BPE。分词训练把编码器与 token 字节长度表分别保存，后续运行读取这些资产。\n\n`_document_batches` 根据 train / val 选择文件。`make_dataloader` 调用 Tokenizer 编码文本，把文档放入固定长度行，形成相差一位的输入和目标张量。训练与验证共用这个函数，但是 split 和调用场景不同。\n\nBPE 和 Document batches 各自读取 Parquet cache：BPE 通过 `text_iterator` 遍历训练文本，数据装填通过 `_document_batches` 获得带划分的批次。下载到 BPE 的边表示主入口先后顺序。\n\n查看 [prepare.py](https://github.com/karpathy/autoresearch/blob/228791fb499afffb54b46200aca536f79142f117/prepare.py) 的节点证据，可分别追到文件读写和函数调用。"
    },
    {
      "id": "AR_eval_guide",
      "title": "固定指标与结果解释",
      "path": "skylense-guides/autoresearch-evaluation.md",
      "status": "authored-reading-guide",
      "content": "# val_bpb 如何形成\n\n来源：[karpathy/autoresearch](https://github.com/karpathy/autoresearch/tree/228791fb499afffb54b46200aca536f79142f117)，固定提交 `228791fb499afffb54b46200aca536f79142f117`。以下说明由 Skylense 编写；未运行训练，也不展示虚构成绩。\n\n`evaluate_bpb` 创建验证数据流，并要求模型返回未归约的 token 损失。字节长度查找表把目标 token 映射到 UTF-8 字节数，零字节特殊 token 被排除。累计自然对数损失除以字节总数与 log(2)，得到 bits per byte。\n\n训练文件在预算结束后进入 eval 模式，调用评估函数，再向标准输出打印 val_bpb、时间、显存与模型规模。协议要求代理从日志提取结果；Skylense 的连接不意味着指标已在本机测得。\n\n运行预算与实际硬件、编译、评估开销需要分别理解：该实现仅在 step > 10 时累加训练时间；展示没有验证任何设备上的耗时或性能。\n\n核对 [固定评估函数](https://github.com/karpathy/autoresearch/blob/228791fb499afffb54b46200aca536f79142f117/prepare.py#L343-L365) 与 [最终指标输出](https://github.com/karpathy/autoresearch/blob/228791fb499afffb54b46200aca536f79142f117/train.py#L610-L630)。"
    }

y-source","url":"https://github.com/langchain-ai/langgraph/blob/aa742fb31e2827d569b843e3600aeda2e0528e4b/libs/langgraph/langgraph/graph/state.py#L928-L939"}]}],"inputs":["一个或多个起点","终点"],"outputs":["更新后的图构建器"],"evidence":[{"file":"libs/langgraph/langgraph/graph/state.py","lineStart":966,"lineEnd":979,"excerpt":"            self.edges.add((start_key, end_key))\n            return self\n\n        for start in start_key:\n            if start == END:\n                raise ValueError(\"END cannot be a start node\")\n            if start not in self.nodes:\n                raise ValueError(f\"Need to add_node `{start}` first\")\n        if end_key == START:\n            raise ValueError(\"START cannot be an end node\")\n        if end_key != END and end_key not in self.nodes:\n            raise ValueError(f\"Need to add_node `{end_key}` first\")\n\n        self.waiting_edges.add((tuple(start_key), end_key))","sourceType":"repository-source","url":"https://github.com/langchain-ai/langgraph/blob/aa742fb31e2827d569b843e3600aeda2e0528e4b/libs/langgraph/langgraph/graph/state.py#L966-L979"}],"documentIds":["LG_DOC_COMPILE"],"evidenceStatus":"source-verified","evidenceNote":"已核对固定提交的静态源码；输入/输出为中文语义摘要，不是完整签名，也不是执行追踪。"},{"id":"LG_ADD_BRANCH","label":"条件路由","group":"LG_GRAPH","parentId":"LG_GRAPH_BUILDER","level":4,"kind":"interface","path":"libs/langgraph/langgraph/graph/state.py","summary":"保存条件函数与目标映射。","description":"条件函数转换为 Runnable，并记录为 BranchSpec；compile 遍历 branches 将其装配到编译图。","functions":[{"name":"StateGraph.add_conditional_edges","description":"为源节点注册条件分支。","inputs":["源节点","路由函数与可选目标映射"],"outputs":["更新后的图构建器"],"evidence":[{"file":"libs/langgraph/langgraph/graph/state.py","lineStart":982,"lineEnd":994,"excerpt":"    def add_conditional_edges(\n        self,\n        source: str,\n        path: Callable[..., Hashable | Sequence[Hashable]]\n        | Callable[..., Awaitable[Hashable | Sequence[Hashable]]]\n        | Runnable[Any, Hashable | Sequence[Hashable]],\n        path "被更新的通道名集合"],"evidence":[{"file":"libs/langgraph/langgraph/pregel/_algo.py","lineStart":232,"lineEnd":251,"excerpt":"def apply_writes(\n    checkpoint: Checkpoint,\n    channels: Mapping[str, BaseChannel],\n    tasks: Iterable[WritesProtocol],\n    get_next_version: GetNextVersion | None,\n    trigger_to_nodes: Mapping[str, Sequence[str]],\n) -> set[str]:\n    \"\"\"Apply writes from a set of tasks (usually the tasks from a Pregel step)\n    to the checkpoint and channels, and return managed values writes to be applied\n    externally.\n\n    Args:\n        checkpoint: The checkpoint to update.\n        channels: The channels to update.\n        tasks: The tasks to apply writes from.\n        get_next_version: Optional function to determine the next version of a channel.\n        trigger_to_nodes: Mapping of channel names to the set of nodes that can be triggered by updates to that channel.\n\n    Returns:\n        Set of channels that were updated in this step.","sourceType":"repository-source","url":"https://github.com/langchain-ai/langgraph/blob/aa742fb31e2827d569b843e3600aeda2e0528e4b/libs/langgraph/langgraph/pregel/_algo.py#L232-L251"}]}],"inputs":["检查点、通道映射","任务 writes 与版本函数"],"outputs":["被更新的通道名集合"],"evidence":[{"file":"libs/langgraph/langgraph/pregel/_algo.py","lineStart":294,"lineEnd":309,"excerpt":"    # Group writes by channel\n    pending_writes_by_channel: dict[str, list[Any]] = defaultdict(list)\n    for task in tasks:\n        for chan, val in task.writes:\n            if chan in (\n                NO_WRITES,\n                PUSH,\n                RESUME,\n                INTERRUPT,\n                RETURN,\n                ERROR,\n                ERROR_SOURCE_NODE,\n            ):\n                pass\n            elif chan in channels:\n                pending_writes_by_channel[chan].append(val)","sourceType":"repository-source","url":"https://github.com/langchain-ai/langgraph/blob/aa742fb31e2827d569b843e3600aeda2e0528e4b/libs/langgraph/langgraph/pregel/_algo.py#L294-L309"},{"file":"libs/langgraph/langgraph/pregel/_algo.py","lineStart":315,"lineEnd":323,"excerpt":"    # Apply writes to channels\n    updated_channels: set[str] = set()\n    for chan, vals in pending_writes_by_channel.items():\n        if chan in channels:\n            if channels[chan].update(vals) and next_version is not None:\n                checkpoint[\"channel_versions\"][chan] = next_version\n                # unavailable channels can't trigger tasks, so don't add them\n                if channels[chan].is_available():\n                    updated_channels.add(chan)","sourceType":"repository-source","url":"https://github.com/langchain-ai/langgraph/blob/aa742fb31e2827d569b843e3600aeda2e0528e4b/libs/langgraph/langgraph/pregel/_algo.py#L315-L323"}],"documentIds":["LG_DOC_STATE"],"evidenceStatus":"source-verified","evidenceNote":"已核对固定提交的静态源码；输入/输出为中文语义摘要，不是完整签名，也不是执行追踪。"},{"id":"LG_CHANNEL_BASE","label":"BaseChannel 协议","group":"LG_CHANNELS","parentId":"LG_CHANNELS_BASE","level":3,"kind":"schema","path":"libs/langgraph/langgraph/channels/base.py","summary":"统一读、写、恢复和快照接口。","description":"BaseChannel 为具体通道提供 ValueType / UpdateType，并定义 get、update、checkpoint 与 from_checkpoint 等接口；图中的多态连线表示可能采用的通道实现。","functions":[{"name":"BaseChannel.update","description":"应用当前步的一组更新。","inputs":["同一通道的一组更新值"],"outputs":["状态是否变化"],"evidence":[{"file":"libs/langgraph/langgraph/channels/base.py","lineStart":90,"lineEnd":99,"excerpt":"    def update(self, values: Sequence[Update]) -> bool:\n        \"\"\"Update the channel's value with the given sequence of updates.\n        The order of the updates in the sequence is arbitrary.\n        This method is called by Pregel for all channels at the end of each step.\n\n        If there are no updates, it is called with an empty sequence.\n\n        Raises `InvalidUpdateError` if the sequence of updates is invalid.\n\n        Returns `True` if the channel was updated, `False` otherwise.\"\"\"","sourceType":"repository-so 新","通道中保存的值"],"evidence":[{"file":"libs/langgraph/langgraph/channels/last_value.py","lineStart":56,"lineEnd":67,"excerpt":"    def update(self, values: Sequence[Value]) -> bool:\n        if len(values) == 0:\n            return False\n        if len(values) != 1:\n            msg = create_error_message(\n                message=f\"At key '{self.key}': Can receive only one value per step. Use an Annotated key to handle multiple values.\",\n                error_code=ErrorCode.INVALID_CONCURRENT_GRAPH_UPDATE,\n            )\n            raise InvalidUpdateError(msg)\n\n        self.value = values[-1]\n        return True","sourceType":"repository-source","url":"https://github.com/langchain-ai/langgraph/blob/aa742fb31e2827d569b843e3600aeda2e0528e4b/libs/langgraph/langgraph/channels/last_value.py#L56-L67"}]},{"name":"LastValue.get","description":"读取当前保存值。","inputs":["当前通道"],"outputs":["值或空通道错误"],"evidence":[{"file":"libs/langgraph/langgraph/channels/last_value.py","lineStart":69,"lineEnd":72,"excerpt":"    def get(self) -> Value:\n        if self.value is MISSING:\n            raise EmptyChannelError()\n        return self.value","sourceType":"repository-source","url":"https://github.com/langchain-ai/langgraph/blob/aa742fb31e2827d569b843e3600aeda2e0528e4b/libs/langgraph/langgraph/channels/last_value.py#L69-L72"}]}],"inputs":["本步零个或一个值","当前通道"],"outputs":["是否更新","通道中保存的值","值或空通道错误"],"evidence":[{"file":"libs/langgraph/langgraph/channels/last_value.py","lineStart":20,"lineEnd":25,"excerpt":"class LastValue(Generic[Value], BaseChannel[Value, Value, Value]):\n    \"\"\"Stores the last value received, can receive at most one value per step.\"\"\"\n\n    __slots__ = (\"value\",)\n\n    value: Value | Any","sourceType":"repository-source","url":"https://github.com/langchain-ai/langgraph/blob/aa742fb31e2827d569b843e3600aeda2e0528e4b/libs/langgraph/langgraph/channels/last_value.py#L20-L25"}],"documentIds":["LG_DOC_STATE"],"evidenceStatus":"source-verified","evidenceNote":"已核对固定提 errupts from updates stream\n            for chunk in self.stream(\n                input,\n                config,\n                context=context,\n                stream_mode=(\n                    [\"updates\", \"values\"] if stream_mode == \"values\" else stream_mode\n                ),\n                print_mode=print_mode,\n                output_keys=output_keys,\n                interrupt_before=interrupt_before,\n                interrupt_after=interrupt_after,\n                durability=durability,\n                control=control,\n                **kwargs,\n            ):","sourceType":"repository-source","url":"https://github.com/langchain-ai/langgraph/blob/aa742fb31e2827d569b843e3600aeda2e0528e4b/libs/langgraph/langgraph/pregel/main.py#L3911-L3927"}]},{"id":"LG_FLOW_STATE","label":"同一步写入与通道语义","description":"对比单值、归并和短暂值三类更新；具体实现由图的通道配置决定。","nodes":["LG_LOOP_AFTER_TICK","LG_APPLY_WRITES","LG_CHANNEL_BASE","LG_LASTVALUE","LG_BINOP","LG_EPHEMERAL","LG_PREPARE_TASKS"],"edgeIds":["LG_E020","LG_E022","LG_E023","LG_E024","LG_E025","LG_E026","LG_E027","LG_E028","LG_E035"],"kind":"source-reading-scenario","note":"人工选读固定提交的静态结构；可能有分支、汇聚和跨步反馈。动画仅提示已建模关系方向，不是运行中的调用或性能记录。","evidence":[{"file":"libs/langgraph/langgraph/pregel/_loop.py","lineStart":691,"lineEnd":698,"excerpt":"        # all tasks have finished\n        self.updated_channels = apply_writes(\n            self.checkpoint,\n            self.channels,\n            self.tasks.values(),\n            self.checkpointer_get_next_version,\n            self.trigger_to_nodes,\n        )","sourceType":"repository-source","url":"https://github.com/langchain-ai/langgraph/blob/aa742fb31e2827d569b843e3600aeda2e0528e4b/libs/langgraph/langgraph/pregel/_loop.py#L691-L698"}]},{"id":"LG_FLOW_CHECKPOINT","label":"检查点保存与恢复","description":"以可替换的 InMemorySaver 为例，连接构造、保存与下次恢复。","nodes":["LG_STREAM","LG_CHECKPOINT_GET","LG_LOOP_TICK","LG_LOOP_AFTER_TICK","LG_LOOP_CHECKPOINT","LG_CHECKPOINT_CREATE","LG_CHECKPOINT_PUT","LG_CHECKPOINT_BASE","LG_CHANNEL_BASE"],"edgeIds":["LG_E014","LG_E021","LG_E029","LG_E030","LG_E031","LG_E032","LG_E033","LG_E034"],"kind":"source-reading-scenario","note":"人工选读固定提交的静态结构；可能有分支、汇聚和跨步反馈。动画仅提示已建模关系方向，不是运行中的调用或性能记录。","evidence":[{"file":"libs/langgraph/langgraph/pregel/main.py","lineStart":2899,"lineEnd":2905,"excerpt":"            with SyncPregelLoop(\n                input,\n                stream=StreamProtocol(stream.put, stream_modes),\n                config=config,\n                store=store,\n                cache=cache,\n                checkpointer=checkpointer,","sourceType":"repository-source","url":"https://github.com/langchain-ai/langgraph/blob/aa742fb31e2827d569b843e3600aeda2e0528e4b/libs/langgraph/langgraph/pregel/main.py#L2899-L2905"}]}],"documents":[{"id":"LG_DOC_COMPILE","title":"从 StateGraph 到 CompiledStateGraph","path":"skylense-guides/langgraph/compile.md","content":"# 从图定义到可执行图\n\n这是一份 Skylense 为开源 LangGraph 编写的源码阅读导览，不是上游文档全文。\n\n先看 StateGraph 的 add_node、add_edge 与 add_conditional_edges：它们把用户定义写入构建器。compile 随后创建 CompiledStateGraph，并把定义装配成运行时节点、触发器和写入器。\n\n同一个 add_edge API 支持一个起点和起点序列。后者保存在 waiting_edges，编译时形成 barrier channel，表达多个前驱的汇聚。这比把几条线画成互不相关的调用，更适合解释条件与等待关系。\n\nCompiledStateGraph 继承 Pregel，因此编译后的对象提供 stream / invoke 等 API。图中的“编译结果提供 stream”是继承关系投影：compile 不会自己启动执行。\n\n在层级视图中依次展开图定义与编译 → state.py → StateGraph 或 CompiledStateGraph，可查看类与方法层级。证据卡指向同一固定提交的真实源码行。\n\n源码仓库：https://github.com/langchain-ai/langgraph\n\n固定提交：aa742fb31e2827d569b843e3600aeda2e0528e4b\n","status":"authored-source-guide"},{"id":"LG_DOC_EXECUTE","title":"同步 Pregel superstep 阅读路线","path":"skylense-guides/langgraph/execute.md","content":"# 同步 Pregel superstep\n\n这份导览只覆盖选定的同步执行核心。LangGraph 还包含异步执行、事件流版本、缓存、中断与其他机制，此图没有声称穷尽整个仓库。\n\nPregel.invoke 消费 Pregel.stream。stream 创建 SyncPregelLoop 和 PregelRunner，并反复调用 loop.tick、runner.tick、loop.after_tick。\n\ntick 通过 prepare_next_tasks 构建本步任务。准备过程考虑 PUSH 发送和 PULL 触发；runner 负责执行任务，单任务快速路径调用 run_with_retry。节点任务可以并行运行，图中的关系不能解读为所有节点串行执行。\n\n本步任务完成之后，after_tick 统一应用 writes，并安排保存检查点。updated_channels 再参与下一步候选任务选择，形成跨 superstep 的反馈。\n\n连线动画仅表达源码建模的方向。Skylense 没有运行这些节点、调用模型或采集延迟。\n\n源码仓库：https://github.com/langchain-ai/langgraph\n\n固定提交：aa742fb31e2827d569b843e3600aeda2e0528e4b\n","status":"authored-source-guide"},{"id":"LG_DOC_STATE","title":"通道更新与状态边界","path":"skylense-guides/langgraph/state.md","content":"# 通道更新与状态边界\n\nBaseChannel 定义读取、更新、快照与恢复接口。apply_writes 先按通道汇总同一步的任务输出，然后调用各通道实例的 update。\n\nLastValue 每步接受至多一个值；BinaryOperatorAggregate 使用指定的二元操作归并更新；EphemeralValue 在没有新值时清除短暂状态。三种实现都继承 BaseChannel，但语义不同。\n\n从 apply_writes 到具体类型的连线标注为多态投影。它表示“配置为该类型时执行此实现”，不表示每次更新都同时调用三种通道。\n\n状态在 superstep 边界集中更新，之后 updated_channels 帮助确定下一步候选节点。阅读数据反馈线时，应区分当前步的计算与下一步的触发。\n\n源码仓库：https://github.com/langchain-ai/langgraph\n\n固定提交：aa742fb31e2827d569b843e3600aeda2e0528e4b\n","status":"authored-source-guide"},{"id":"LG_DOC_CHECKPOINT","title":"检查点协议与内存实现","path":"skylense-guides/langgraph/checkpoint.md","content":"# 检查点协议与内存实现\n\nPregelLoop 在需要保存时通过 create_checkpoint 构造快照，再安排 saver.put。同步保存回调等待前一保存完成，从而保持检查点顺序。\n\n本例选读 BaseCheckpointSaver 和 InMemorySaver。内存实现把通道值放入 blobs，把检查点和元数据放入 storage；get_tuple 按 thread、namespace 和可选 checkpoint ID 读取并恢复关联信息。\n\nInMemorySaver 的源码明确将其用途限定为调试和测试。此图用它解释接口实现，并不把它当作生产数据库或持久化部署方案。\n\nstream 进入 SyncPregelLoop 时读取配置的 saver.get_tuple。只有配置了 InMemorySaver 才会走这里展示的具体内存实现；其他 saver 不在当前选读范围。\n\n许可：LangGraph 采用 MIT，完整许可和源码文件 SHA-256 清单随 langgraph.sources.json 提供。所有依据均固定到同一提交，代码未安装或执行。\n\n源码仓库：https://github.com/langchain-ai/langgraph\n\n固定提交：aa742fb31e2827d569b843e3600aeda2e0528e4b\n","status":"authored-source-guide"}]},"vllm":{"meta":{"id":"vllm","title":"vllm-project / vLLM","description":"从 OpenAI 请求到异步引擎、调度、KV 缓存和 GPU Worker 的源码阅读地图。","repository":"https://github.com/vllm-project/vllm","revision":"9d75dd454431ccbb3c249b172cf525a5ddc745ee","license":"Apache-2.0","evidenceNote":"固定 commit 的精选核心源码快照。所有原文片段来自公开仓库；中文说明为人工阅读摘要。未运行 vLLM，未生成全仓库依赖图或实测调用轨迹。","functionNote":"函数名来自固定版本源码；输入输出为中文 nferenceNote。导图中的最短路径只表示这些选定关系的连通性。\n\n## 刻意省略\n\n未展开 tokenizer、模型实现、CUDA 内核、Ray 后端、新 GPU runner 的内部结构、投机解码、所有多模态路径与分布式故障处理。省略不代表这些功能不存在。\n","status":"authored-guide","sourceType":"authored-analysis"},{"id":"VL_GUIDE_BOUNDARIES","title":"动态装配与选定分支边界","path":"guides/vllm-boundaries.zh.md","content":"# 动态装配与版本边界\n\n这份快照特别保留了三处不能简化成固定调用链的边界。\n\n- OpenAIServingChat 调用 EngineClient 接口。所选 API launcher 创建 AsyncLLM，所以二者的具体实现关系标为 inferred。\n- EngineCore 使用配置选定的 scheduler。这里展示 Scheduler，不能声称所有配置都执行这个类的每个方法。\n- Worker 会根据配置创建 GPUModelRunnerV2 或既有 GPUModelRunnerV1。本图只展开 gpu_model_runner.py 中的既有分支；它并不是整个仓库唯一的 GPU 执行路径。\n\nEngineCoreClient 也有进程内、同步多进程、异步多进程及数据并行变体。图中的核心通信边是概括这些客户端责任的架构联系，不宣称抽象基类直接执行 EngineCore.step。\n\n旧 vllm/entrypoints/openai/api_server.py 在此 commit 中为兼容导出并带弃用警告，节点采用新的 launchers/api_server/entry.py 路径。\n\nKVCacheBlock 是块元数据；BlockPool 中的块管理不能直接等同于 GPU KV 张量的物理布局。查看设备初始化需要继续阅读 GPU Worker 与 runner。\n","status":"authored-guide","sourceType":"authored-analysis"}]}} };

    "path-move": (value, id) => { captureRoute(); const index = Number(id), next = index + Number(value); if (index > 0 && next > 0 && next < routeDraft.stops.length - 1) [routeDraft.stops[index], routeDraft.stops[next]] = [routeDraft.stops[next], routeDraft.stops[index]]; routeResult = null; renderRoute(`path-stop-${next}`); },
    "path-swap": () => { captureRoute(); [routeDraft.stops[0], routeDraft.stops[routeDraft.stops.length - 1]] = [routeDraft.stops.at(-1), routeDraft.stops[0]]; routeResult = null; renderRoute("route-from"); },
    "path-clear": () => { captureRoute(); routeDraft.stops = [routeDraft.stops[0], routeDraft.stops.at(-1)]; routeResult = null; renderRoute("route-from"); },
    "find-route": () => { captureRoute(); routeResult = SkylensePaths.search(data, routeDraft); routeResults(); },
    "apply-path": (_, id) => {
      const path = routeResult?.paths[Number(id)];
      if (!path) return;
      rememberRelation();
      state.trace = pathTrace(routeResult.options, path.key);
      state.type = "all"; state.lens = "scope"; state.selected = state.trace.start;
      state.relation = null; state.scope = null; state.mode = "components"; state.flow = null;
      $("#modal").close(); render();
      toast(`已显示 ${path.steps.length} 跳的关系路径；原始箭头方向保持不变。`);
    },
    "zoom-in": () => zoom(1.2),
    "zoom-out": () => zoom(1 / 1.2),
    fit: fitCanvas,
    theme: showThemes,
    "choose-theme": (_, id) => {
      const camera = { ...state.camera };
      themeId = SkylenseThemes.resolve(id).id;
      state.dark = SkylenseThemes.apply(themeId).dark;
      storage.set("theme", themeId);
      storage.set("dark", state.dark);
      render(); state.camera = camera; applyCamera();
      showThemes();
      $(`[data-action="choose-theme"][data-id="${themeId}"]`)?.focus();
    },
    connect: showConnect,
    "copy-command": async (value) => {
      try { await navigator.clipboard.writeText(value); toast("命令已复制。"); }
      catch { toast("浏览器未开放剪贴板，请选中命令复制。"); }
    },
    presentation: () => { $("#modal").close(); if (!state.present) actions.present(); },
    compare: (_, id) => compare(id),
    "show-compare": showCompare,
    "clear-compare": () => {
      state.compare = [];
      renderCompare();
    },
    "compare-jump": (_, id) => {
      $("#modal").close();
      select(id);
    },
    "toggle-sidebar": () => $("#sidebar").classList.toggle("open"),
    "toggle-inspector": () => $("#inspector").classList.toggle("open"),
    "close-inspector": () => $("#inspector").classList.remove("open"),
    "close-modal": () => $("#modal").close(),
    export: exportMenu,
    "export-json": () => {
      download("skylense-model.json", JSON.stringify(data, null, 2));
      toast("完整模型已导出。");
    },
    "export-svg": exportSVG,
    import: () => $("#import-file").click(),
    document: (_, id) => documentModal(id),
    "all-docs": () =>
      modal(
        "项目文档",
        `${(data.documents || []).map((d) => `<button class="connection" data-action="document" data-id="${escape(d.id)}">${icon("document")}<span>${escape(d.title)}<small>${escape(d.path)}</small></span>${icon("arrow")}</button>`).join("")}`,
      ),
    save: () =>
      modal(
        "保存当前阅读位置",
        `<p>保留当前模块、选择、关系筛选、路径与视口。${imported ? "导入模型的书签仅保留在当前会话。" : "视图保存在此浏览器本地。"}</p><label>视图名称<input id="view-name" maxlength="80" value="${escape((state.selected ? label(state.selected) : "系统总览") + " · " + (state.trace ? "路径" : "探索"))}"></label><div class="modal-actions"><button class="btn primary" data-action="confirm-save">保存视图</button></div>`,
      ),
    "confirm-save": () => {
      const name = $("#view-name").value.trim();
      if (!name) {
        toast("请填写视图名称。");
        return;
      }
      saved.push({ name, state: snapshotState() });
      if (!imported && !storage.set(viewStorageKey, saved))
        toast("浏览器无法持久保存；此会话仍可使用。");
      else toast(imported ? "视图已保存在当前会话。" : "视图已保存在本地。");
      $("#modal").close();
      renderSidebar();
    },
    "load-view": (_, id) => {
      const s = saved[Number(id)]?.state;
      if (!s) return;
      if (
        (s.selected && !all.has(s.selected)) ||
        (s.scope && !containers.has(s.scope))
      ) {
        toast("此视图属于另一个模型。");
        return;
      }
      Object.assign(state, s);
      if (s.trace?.kind === "path") state.trace = pathTrace(s.trace.plan, s.trace.choice);
      state.lens = ["scope", "neighbors", "global"].includes(s.lens)
        ? s.lens
        : "scope";
      state.present = s.present === true;
      state.openContainers = Array.isArray(s.openContainers)
        ? s.openContainers.filter((id) => containers.has(id))
        : [];
      state.bundle = s.bundle !== false;
      state.levelFocus = validLevelFocus(s.levelFocus);
      state.focusDimming = s.focusDimming !== false;
      state.categoryGroups = s.categoryGroups !== false;
      state.relation =
        s.relation &&
        s.relation.edgeIds?.every((id) => data.edges.some((e) => e.id === id))
          ? s.relation
          : null;
      state.lastRelation =
        s.lastRelation &&
        Array.isArray(s.lastRelation.edgeIds) &&
        s.lastRelation.edgeIds.every((id) =>
          data.edges.some((e) => e.id === id),
        )
          ? s.lastRelation
          : null;
      render();
      if (s.camera) {
        state.camera = { ...s.camera };
        applyCamera();
      }
    },
    "delete-view": (_, id) => {
      saved.splice(Number(id), 1);
      if (!imported) storage.set(viewStorageKey, saved);
      renderSidebar();
    },
    help: () =>
      modal(
        "探索快捷键",
        `<p><kbd>/</kbd> 搜索组件与函数<br><kbd>0</kbd> 适应画布<br><kbd>+</kbd> / <kbd>−</kbd> 缩放<br><kbd>R</kbd> 探索带必经点的关系路径<br><kbd>M</kbd> 暂停 / 开启连线流动<br><kbd>T</kbd> 选择工作空间主题<br><kbd>Esc</kbd> 关闭弹窗、预览或追踪<br><kbd>?</kbd> 打开帮助</p><p>单击节点固定详情；双击容器展开层级。悬停节点或连接可快速预览；「对照」将两个节点并排展示。</p><p>内置示例根据固定 commit 的公开源码整理，覆盖精选核心组件。关系、输入输出和章节是阅读视图；动态流动表示箭头方向，不是实际运行轨迹。</p>`,
      ),
  };
  let lastNodeClick = { id: null, time: 0 };
  document.addEventListener("click", (e) => {
    const button = e.target.closest("[data-action]");
    if (!button) return;
    if (
      button.classList.contains("graph-node") &&
      containers.has(button.dataset.id)
    ) {
      const id = button.dataset.id;
      if (lastNodeClick.id === id && e.timeStamp - lastNodeClick.time < 500) {
        lastNodeClick = { id: null, time: 0 };
        e.preventDefault();
        scope(id);
        return;
      }
      lastNodeClick = { id, time: e.timeStamp };
    }
    const action = actions[button.dataset.action];
    if (action) {
      e.preventDefault();
      action(button.dataset.value, button.dataset.id);
    }
  });
  document.addEventListener("dblclick", (e) => {
    const n = e.target.closest(".graph-node");
    if (n && containers.has(n.dataset.id)) scope(n.dataset.id);
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "search") {
      state.query = e.target.value;
      renderTree();
    }
  });
  document.addEventListener("change", (e) => {
    if (e.target.closest("#path-builder")) { captureRoute(); invalidateRoute(); return; }
    if (e.target.id === "example-select") {
      const id = e.target.value;
      if (!Object.hasOwn(window.SKYLENSE_MODELS || {}, id)) return;
      const url = new URL(location.href);
      url.search = new URLSearchParams({ example: id }).toString();
      url.hash = "";
      location.assign(url.href);
      return;
    }
    if (e.target.id === "edge-filter") {
      state.type = e.target.value;
      if (
        state.relation &&
        selectedRelationEdges().some(
          (edge) => state.type !== "all" && edge.type !== state.type,
        )
      ) {
        state.relation = null;
        toast("当前关系已被类型筛选隐藏，已退出关系详情。");
        renderInspector();
      }
      if (state.trace?.kind === "relation") {
        const edges = filteredEdges().filter((edge) =>
          state.trace.edges.includes(edge.id),
        );
        state.trace = edges.length
          ? {
              kind: "relation",
              edges: edges.map((edge) => edge.id),
              nodes: [
                ...new Set(edges.flatMap((edge) => [edge.source, edge.target])),
              ],
            }
          : null;
      }
      if (state.trace?.kind === "path") {
        // The main filter narrows the route's own types without losing its stops.
        const plan = { ...state.trace.plan, types: state.type === "all" ? null : [state.type] };
        state.trace = pathTrace(plan, state.trace.choice);
        routeDraft = structuredClone(plan);
        if (state.trace.error) toast(pathError(state.trace.error));
      } else if (state.trace?.origins)
        state.trace = makeContextTrace(
          state.trace.origins,
          state.trace.direction,
        );
      else if (state.trace?.direction)
        state.trace = {
          ...AtlasGraph.reachable(
            filteredEdges(),
            state.trace.origin || state.selected,
            state.trace.direction,
          ),
          direction: state.trace.direction,
          origin: state.trace.origin || state.selected,
        };
      else if (state.trace?.start) {
        const { start, end } = state.trace;
        const route = AtlasGraph.shortestPath(filteredEdges(), start, end);
        state.trace = route ? { ...route, start, end } : null;
        if (!route) toast("当前关系类型没有这条路径，已退出追踪。");
      }
      renderCanvas(true);
      renderInspector();
      hash();
    }
  });
  $("#import-file").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const previousData = data,
      previousImported = imported,
      previousSaved = saved,
      previousState = { ...state, expanded: new Set(state.expanded) };
    try {
      if (file.size > 15 * 1024 * 1024)
        throw new Error("JSON 文件超过 15 MB。");
      const parsed = JSON.parse(await file.text());
      AtlasGraph.validate(parsed);
      data = parsed;
      index();
      imported = true;
      saved = [];
      routeDraft = null; routeResult = null;
      Object.assign(state, {
        scope: null,
        selected: null,
        trace: null,
        flow: null,
        mode: "hierarchy",
        query: "",
        compare: [],
        expanded: new Set(),
        lens: "scope",
        levelFocus: "auto",
        focusDimming: true,
        categoryGroups: true,
        present: false,
        openContainers: [],
        relation: null,
        lastRelation: null,
        type: "all",
      });
      readingHistory.length = 0;
      cameraCache.clear();
      sceneCache.clear();
      $("#modal").close();
      render();
      toast(`已载入 ${data.nodes.length} 个组件，数据仅保留于当前浏览器会话。`);
    } catch (err) {
      data = previousData;
      imported = previousImported;
      saved = previousSaved;
      index();
      Object.assign(state, previousState);
      render();
      toast("导入失败：" + err.message);
    } finally {
      e.target.value = "";
    }
  });
  document.addEventListener("keydown", (e) => {
    if (
      e.target.matches("input,textarea,select") ||
      e.metaKey ||
      e.ctrlKey ||
      e.altKey
    )
      return;
    if ($("#modal").open && e.key !== "Escape") return;
    if ((e.key === "Enter" || e.key === " ") && e.target.matches(".edge-hit")) {
      e.preventDefault();
      actions.relation(null, e.target.dataset.id);
      return;
    }
    const key = e.key.toLowerCase();
    if (
      state.present &&
      state.mode === "flow" &&
      ["arrowright", "arrowleft"].includes(key)
    ) {
      e.preventDefault();
      actions[key === "arrowright" ? "next-step" : "prev-step"]();
    } else if (key === "/") {
      e.preventDefault();
      $("#sidebar").classList.add("open");
      $("#search").focus();
    } else if (key === "0") {
      fitCanvas();
    } else if (key === "+" || key === "=") {
      zoom(1.2);
    } else if (key === "-") {
      zoom(1 / 1.2);
    } else if (key === "r") {
      openRoute();
    } else if (key === "m") {
      actions.motion();
    } else if (key === "t") {
      actions.theme();
    } else if (key === "?") {
      actions.help();
    } else if (key === "escape") {
      hidePeek();
      if ($("#modal").open) $("#modal").close();
      else if (state.present) actions.present();
      else if (state.trace) actions["clear-trace"]();
      else {
        $("#inspector").classList.remove("open");
        $("#sidebar").classList.remove("open");
      }
    }
  });
  window.addEventListener("hashchange", () => {
    state.trace = null;
    readHash();
    render();
  });
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCanvas, 120);
  });
  render();
  // Read-only inspection API used by local validation, without exposing mutable UI state.
  window.Atlas = Object.freeze({
    getState: () => JSON.parse(JSON.stringify(snapshotState())),
    getTheme: () => themeId,
    getMotion: () => ({
      wanted: motionWanted,
      reduced: reducedMotion.matches,
      hidden: document.hidden,
      ...motion.stats(),
    }),
    getFocus: () => focusContext(),
    getLevels: () => ({
      ...levelSelection(),
      highlighted: highlightedLevels(),
    }),
    getCounts: () => ({
      nodes: data.nodes.length,
      edges: data.edges.length,
      containers: containers.size,
      functions: data.nodes.reduce((s, n) => s + (n.functions || []).length, 0),
    }),
    getVisible: () => layout.items.map((p) => p.n.id),
    getScene: () =>
      JSON.parse(
        JSON.stringify({
          items: layout.items.map((p) => ({
            id: p.n.id,
            x: p.x,
            y: p.y,
            w: p.w,
            h: p.h,
          })),
          bounds: layout.bounds,
          categoryBounds: layout.categoryBounds || [],
          relations: layout.relations.map((r) => ({
            id: r.id,
            edgeIds: r.edgeIds,
            sources: r.sources,
            targets: r.targets,
            type: r.type,
            label: r.label,
          })),
          wires: layout.wires.map((w) => ({
            relation: w.relation.id,
            from: w.from,
            to: w.to,
            edgeIds: wireMembers(w),
            points: w.points,
            blocked: w.blocked,
          })),
          hubs: layout.hubs.map((h) => ({
            id: h.id,
            x: h.x,
            y: h.y,
            w: h.w,
            h: h.h,
          })),
        }),
      ),
  });
})();

</script>
  </body>
</html>
